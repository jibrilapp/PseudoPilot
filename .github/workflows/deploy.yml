name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Deploy apps/web to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Enable by setting repository variable VERCEL_DEPLOY_ENABLED=true
    # plus secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (see docs/DEPLOY.md).
    if: ${{ vars.VERCEL_DEPLOY_ENABLED == 'true' }}

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: pnpm dlx vercel@39 --version

      - name: Pull Vercel project settings
        run: pnpm dlx vercel@39 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for production
        run: pnpm dlx vercel@39 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt
        id: deploy
        run: |
          URL=$(pnpm dlx vercel@39 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${URL}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}