# PseudoPilot local infrastructure (foundation)
#
# Scale-relevant pieces included on day one:
# - PostgreSQL (system of record)
# - PgBouncer (connection pooling — required before horizontal API replicas)
# - Redis (sessions, rate limits, job queues)
#
# Runtime sandboxes and AI workers are NOT run here yet (no product features).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pseudopilot
      POSTGRES_USER: pseudopilot
      POSTGRES_PASSWORD: pseudopilot
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pseudopilot -d pseudopilot']
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p1
    environment:
      DB_USER: pseudopilot
      DB_PASSWORD: pseudopilot
      DB_HOST: postgres
      DB_NAME: pseudopilot
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 50
      LISTEN_PORT: 6432
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
